<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Checker</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="age-checker">
      <!-- Header -->
      <header class="header">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M1 21v-2a7 7 0 0 1 14 0v2z"></path>
            <circle cx="18" cy="8" r="3"></circle>
            <path d="M17 14a5 5 0 0 1 6 5v2h-6z"></path>
          </svg>
        </div>

        <h1>Age Checker</h1>
        <p>Enter your age to see what you can do.</p>
      </header>

      <!-- Input -->
      <section class="form-section">
        <div class="form-group">
          <label for="age">Your age</label>

          <input
            type="number"
            id="age"
            placeholder="Enter your age"
            min="0"
            step="1"
          />

          <p class="error-message" id="age-error"></p>
        </div>

        <button class="check-btn" type="button">Check Age</button>
      </section>

      <!-- Result -->
      <section class="result-box" aria-live="polite">
        <span class="result-icon">✓</span>
        <p class="result-text">Your result will appear here.</p>
      </section>

      <!-- Rules -->
      <section class="rules-box">
        <h2>ⓘ Rules:</h2>

        <ul>
          <li>Under 13 — You are a child.</li>
          <li>13–17 — You are a teenager.</li>
          <li>18 and over — You are an adult.</li>
        </ul>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
